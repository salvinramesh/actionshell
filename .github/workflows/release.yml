name: Build & Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g. 1.0.0)'
        required: true
        default: '1.0.0'

permissions:
  contents: write

jobs:
  build-linux:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y \
            libsecret-1-dev libgtk-3-dev libnss3 \
            python3 make g++ libx11-dev libxkbfile-dev \
            libnotify-dev libxtst-dev

      - name: Install Node dependencies
        run: npm install --legacy-peer-deps --ignore-scripts

      - name: Rebuild native modules for Electron (Linux)
        run: npx electron-rebuild -f -w better-sqlite3,node-pty
        timeout-minutes: 20

      - name: Build Vite bundles
        run: npx electron-vite build

      - name: Package Linux installers
        run: npx electron-builder --linux deb AppImage --x64 --publish never
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-builds
          path: |
            dist/*.deb
            dist/*.AppImage
          if-no-files-found: warn

  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Node dependencies
        run: npm install --legacy-peer-deps --ignore-scripts

      - name: Rebuild native modules for Electron (Windows)
        run: npx electron-rebuild -f -w better-sqlite3,node-pty
        timeout-minutes: 20

      - name: Build Vite bundles
        run: npx electron-vite build

      - name: Package Windows installer
        run: npx electron-builder --win nsis zip --x64 --publish never
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-builds
          path: |
            dist/*.exe
            dist/*.zip
          if-no-files-found: warn

  release:
    needs: [build-linux, build-windows]
    runs-on: ubuntu-22.04
    if: always() && (needs.build-linux.result == 'success' || needs.build-windows.result == 'success')
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download Linux artifacts
        uses: actions/download-artifact@v4
        with:
          name: linux-builds
          path: artifacts/linux
        continue-on-error: true

      - name: Download Windows artifacts
        uses: actions/download-artifact@v4
        with:
          name: windows-builds
          path: artifacts/windows
        continue-on-error: true

      - name: List artifacts
        run: find artifacts/ -type f 2>/dev/null || echo "No artifacts"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name || format('v{0}', github.event.inputs.version) }}
          name: "ActionShell ${{ github.ref_name || format('v{0}', github.event.inputs.version) }}"
          draft: false
          prerelease: false
          body: |
            ## ActionShell ${{ github.ref_name }}

            Enterprise SSH & SFTP Management Platform

            ### Downloads
            | Platform | File | Description |
            |----------|------|-------------|
            | 🪟 Windows | `ActionShell-*-Setup-x64.exe` | Windows Installer |
            | 🪟 Windows | `ActionShell-*-x64.zip` | Windows Portable |
            | 🐧 Linux | `ActionShell-*-x64.AppImage` | Linux Universal |
            | 🐧 Linux | `ActionShell-*-amd64.deb` | Debian/Ubuntu |

            ### Installation
            **Windows:** Run the `.exe` installer, follow prompts.
            **Linux AppImage:** `chmod +x ActionShell-*.AppImage && ./ActionShell-*.AppImage`
            **Linux DEB:** `sudo dpkg -i actionshell_*_amd64.deb`

            ### First Launch
            On first run you will be prompted to create a **Super Admin** account.
          files: |
            artifacts/linux/*.deb
            artifacts/linux/*.AppImage
            artifacts/windows/*.exe
            artifacts/windows/*.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
