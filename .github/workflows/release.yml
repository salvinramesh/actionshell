name: Build & Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g. 1.0.0)'
        required: true
        default: '1.0.0'

permissions:
  contents: write

jobs:
  build-linux:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install system build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y \
            libsecret-1-dev libgtk-3-dev libnss3 \
            python3 make g++ libx11-dev libxkbfile-dev \
            libnotify-dev libxtst-dev fakeroot

      - name: Install Node dependencies
        run: npm install --legacy-peer-deps --ignore-scripts

      - name: Get Electron version
        id: electron_ver
        run: node -e "process.stdout.write('version=' + require('./node_modules/electron/package.json').version + '\n')" >> $GITHUB_OUTPUT

      - name: Install better-sqlite3 prebuilt for Electron
        run: |
          cd node_modules/better-sqlite3
          npx prebuild-install --runtime electron --target ${{ steps.electron_ver.outputs.version }} --arch x64 --platform linux --tag-prefix v \
            || echo "WARNING: prebuild-install failed, electron-builder will compile from source"

      - name: Install node-pty prebuilt for Electron
        run: |
          cd node_modules/node-pty
          npx prebuild-install --runtime electron --target ${{ steps.electron_ver.outputs.version }} --arch x64 --platform linux \
            || npx prebuild-install --runtime electron --target 30.0.0 --arch x64 --platform linux \
            || npx node-gyp rebuild --target=${{ steps.electron_ver.outputs.version }} --arch=x64 --dist-url=https://electronjs.org/headers

      - name: Install cpu-features prebuilt (ssh2 dependency)
        run: |
          cd node_modules/cpu-features
          npx node-gyp rebuild --target=${{ steps.electron_ver.outputs.version }} --arch=x64 --dist-url=https://electronjs.org/headers || true

      - name: Build Vite bundles
        run: npx electron-vite build

      - name: Package Linux installers
        run: npx electron-builder --linux deb AppImage --x64 --publish never
        env:
          DEBUG: electron-builder

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-builds
          path: |
            dist/*.deb
            dist/*.AppImage
          if-no-files-found: warn

  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Node dependencies
        run: npm install --legacy-peer-deps --ignore-scripts

      - name: Get Electron version
        id: electron_ver
        shell: bash
        run: node -e "process.stdout.write('version=' + require('./node_modules/electron/package.json').version + '\n')" >> $GITHUB_OUTPUT

      - name: Install better-sqlite3 prebuilt for Electron (Windows)
        shell: bash
        run: |
          cd node_modules/better-sqlite3
          npx prebuild-install --runtime electron --target ${{ steps.electron_ver.outputs.version }} --arch x64 --platform win32 --tag-prefix v \
            || echo "WARNING: prebuild-install failed"

      - name: Install node-pty prebuilt for Electron (Windows)
        shell: bash
        run: |
          cd node_modules/node-pty
          npx prebuild-install --runtime electron --target ${{ steps.electron_ver.outputs.version }} --arch x64 --platform win32 \
            || npx prebuild-install --runtime electron --target 30.0.0 --arch x64 --platform win32

      - name: Build Vite bundles
        run: npx electron-vite build

      - name: Package Windows installer
        run: npx electron-builder --win nsis zip --x64 --publish never

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-builds
          path: |
            dist/*.exe
            dist/*.zip
          if-no-files-found: warn

  release:
    needs: [build-linux, build-windows]
    runs-on: ubuntu-22.04
    if: always() && (needs.build-linux.result == 'success' || needs.build-windows.result == 'success')
    steps:
      - name: Download Linux artifacts
        uses: actions/download-artifact@v4
        with:
          name: linux-builds
          path: artifacts/linux
        continue-on-error: true

      - name: Download Windows artifacts
        uses: actions/download-artifact@v4
        with:
          name: windows-builds
          path: artifacts/windows
        continue-on-error: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name || format('v{0}', github.event.inputs.version) }}
          name: "ActionShell ${{ github.ref_name || format('v{0}', github.event.inputs.version) }}"
          draft: false
          prerelease: false
          body: |
            ## ActionShell ${{ github.ref_name }}

            Enterprise SSH & SFTP Management Platform

            ### Downloads
            | Platform | File | Description |
            |----------|------|-------------|
            | 🪟 Windows | `ActionShell-*-Setup-x64.exe` | Windows Installer |
            | 🪟 Windows | `ActionShell-*-x64.zip` | Windows Portable |
            | 🐧 Linux | `ActionShell-*-x64.AppImage` | Linux Universal |
            | 🐧 Linux | `ActionShell-*-amd64.deb` | Debian/Ubuntu |

            ### Installation
            **Windows:** Run `.exe` installer, follow setup prompts.
            **Linux AppImage:** `chmod +x ActionShell-*.AppImage && ./ActionShell-*.AppImage`
            **Linux DEB:** `sudo dpkg -i actionshell_*_amd64.deb`

            ### First Launch
            On first run, create your **Super Admin** account.
          files: |
            artifacts/linux/*.deb
            artifacts/linux/*.AppImage
            artifacts/windows/*.exe
            artifacts/windows/*.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
