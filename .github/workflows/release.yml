name: Build & Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to upload Windows builds to (e.g. v1.0.0)'
        required: true
        default: 'v1.0.0'

permissions:
  contents: write

jobs:
  build-linux:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install system build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y \
            libsecret-1-dev libgtk-3-dev libnss3 \
            python3 make g++ libx11-dev libxkbfile-dev \
            libnotify-dev libxtst-dev fakeroot rpm

      - name: Install Node dependencies
        run: |
          npm config set fetch-retries 5
          npm config set fetch-retry-mintimeout 20000
          npm config set fetch-retry-maxtimeout 120000
          for i in {1..3}; do
            echo "Attempt $i to install dependencies..."
            npm install --legacy-peer-deps --ignore-scripts && break || {
              if [ $i -eq 3 ]; then
                echo "Failed to install dependencies after 3 attempts."
                exit 1
              fi
              echo "Install failed, retrying in 10 seconds..."
              sleep 10
            }
          done

      - name: Get Electron version
        id: electron_ver
        run: node -e "process.stdout.write('version=' + require('./node_modules/electron/package.json').version + '\n')" >> $GITHUB_OUTPUT

      - name: Install better-sqlite3 prebuilt for Electron
        run: |
          cd node_modules/better-sqlite3
          npx prebuild-install --runtime electron --target ${{ steps.electron_ver.outputs.version }} --arch x64 --platform linux --tag-prefix v \
            || echo "prebuild-install failed — will compile from source"

      - name: Remove cpu-features (optional ssh2 dep with broken gyp)
        run: rm -rf node_modules/cpu-features

      - name: Rebuild node-pty for Electron (Linux)
        run: npx electron-rebuild -f -w node-pty --target ${{ steps.electron_ver.outputs.version }} --arch x64

      - name: Build Vite bundles
        run: npx electron-vite build

      - name: Package Linux installers
        run: npx electron-builder --linux deb AppImage --x64 --publish never

      - name: Upload Linux builds directly to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          files: |
            dist/*.deb
            dist/*.AppImage
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-windows:
    runs-on: windows-2022
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Node dependencies
        shell: bash
        run: |
          npm config set fetch-retries 5
          npm config set fetch-retry-mintimeout 20000
          npm config set fetch-retry-maxtimeout 120000
          for i in {1..3}; do
            echo "Attempt $i to install dependencies..."
            npm install --legacy-peer-deps --ignore-scripts --include=optional && break || {
              if [ $i -eq 3 ]; then
                echo "Failed to install dependencies after 3 attempts."
                exit 1
              fi
              echo "Install failed, retrying in 10 seconds..."
              sleep 10
            }
          done

      - name: Install Windows platform-specific packages
        shell: bash
        run: |
          # npm install from a Linux lockfile excludes Windows-only optional packages.
          # Install all required Windows platform binaries explicitly.
          npm install \
            @rollup/rollup-win32-x64-msvc \
            @esbuild/win32-x64 \
            --no-save --legacy-peer-deps --ignore-scripts 2>/dev/null || true

      - name: Setup MSVC Developer Environment
        uses: ilammy/msvc-dev-cmd@v1

      - name: Get Electron version
        id: electron_ver
        shell: bash
        run: node -e "process.stdout.write('version=' + require('./node_modules/electron/package.json').version + '\n')" >> $GITHUB_OUTPUT

      - name: Install better-sqlite3 prebuilt for Electron (Windows)
        shell: bash
        run: |
          cd node_modules/better-sqlite3
          npx prebuild-install --runtime electron --target ${{ steps.electron_ver.outputs.version }} --arch x64 --platform win32 --tag-prefix v \
            || echo "prebuild-install failed — will compile from source"

      - name: Remove cpu-features (optional ssh2 dep with broken gyp)
        shell: bash
        run: rm -rf node_modules/cpu-features

      - name: Setup Python with setuptools (for node-gyp on Python 3.12)
        run: pip install setuptools

      - name: Install standard node-gyp globally
        run: npm install -g node-gyp@latest

      - name: Rebuild node-pty for Electron (Windows)
        shell: pwsh
        run: |
          # Use globally-installed standard node-gyp (not @electron/node-gyp
          # which has a broken VS 2022 version finder).
          # Do NOT pass --msvs_version — let node-gyp auto-detect without
          # version constraints so it accepts whatever VS is installed.
          # Remove npm_config_msvs_version from env to prevent interference.
          Remove-Item Env:npm_config_msvs_version -ErrorAction SilentlyContinue
          Remove-Item Env:GYP_MSVS_VERSION -ErrorAction SilentlyContinue
          Remove-Item Env:MSVS_VERSION -ErrorAction SilentlyContinue
          cd node_modules/node-pty
          node-gyp rebuild `
            --target=${{ steps.electron_ver.outputs.version }} `
            --arch=x64 `
            --dist-url=https://electronjs.org/headers `
            --runtime=electron

      - name: Build Vite bundles
        run: npx electron-vite build

      - name: Package Windows installer
        run: npx electron-builder --win nsis zip --x64 --publish never

      - name: List dist folder
        shell: bash
        run: ls -lh dist/

      - name: Upload Windows builds directly to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          files: |
            dist/*.exe
            dist/*.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
